DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 127.0.0.1
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 100M
MaxThreads 4
MaxQueue 8
ReadTimeout 15
CommandReadTimeout 5
MaxScanTime 10000
AlertExceedsMax yes
AlertEncrypted yes
ExitOnOOM yes
LogTime yes
