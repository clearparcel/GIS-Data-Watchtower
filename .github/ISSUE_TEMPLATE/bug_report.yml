name: Bug report
description: Report a reproducible problem in the public dashboard, exports, or Watchtower code.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Watchtower. Never publish credentials, private GIS records, operational endpoints, personal information, or vulnerability details. Report security issues privately using SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Public dashboard
        - County page or county map
        - MN GAC field statistics
        - Public export (JSON, CSV, Excel)
        - Installer / CLI / configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the public page URL, county/source label, and observation timestamp when relevant.
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Screenshots, browser/OS version, exact public links, or console error excerpts with secrets removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Disclosure check
      options:
        - label: This report contains no secrets, personal records, private deployment details, or vulnerability disclosure.
          required: true
