version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # init and analyze must run the same CodeQL version; separate PRs fail
      # SARIF processing, so keep them in one update.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Keeps the digest-pinned base image in the Dockerfile current. CI reads the
  # base image from the Dockerfile, so there is no second copy to update.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
