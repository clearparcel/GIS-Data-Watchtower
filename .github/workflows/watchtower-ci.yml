name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile
        run: python -m compileall -q clearparcel tests
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - name: CLI smoke test
        run: watchtower --config config/example_sources.json status --json

      - name: Container smoke test
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.14'
        run: |
          docker build --build-arg WATCHTOWER_BUILD_REVISION=${{ github.sha }} -t watchtower-ci .
          docker run --rm watchtower-ci --help
          docker run --rm --entrypoint python watchtower-ci -c "from clearparcel.datawatch.build_info import application_identity; assert application_identity()['revision'] == '${{ github.sha }}'"
